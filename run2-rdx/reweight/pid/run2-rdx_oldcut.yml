trees:  # This is optional
    - TupleB0/DecayTree
    - TupleBminus/DecayTree

# NOTE!! If cut values are not specified in name, NNk cut is at 0.2, NNg cut is at 0.3, NNp cut is at 0.4
# To emulate angular analysis, also have variables for NNk at 0.2 and NNg at 0.2 (numbers should be specified for these variables)

interpolate_global: true

config:
    # wpid_mu:
    #     histo_name: eff  # This is optional. Declared here for demonstration only
    #     particle: Mu_nopt
    #     vars:
    #         - mu_P
    #         - GUARD(ETA(mu_P, mu_PZ), 1.5, 5.5)
    #         - GUARD(nTracks, 0, 600)
    #     interpolate: false # This is optional. Default behavior is set with interpolate_global above.
    wpid_mu_ubdt:
        particle: Mu_ubdt
        vars:
            - GUARD(mu_P, 100.0, 200000.0)
            - GUARD(ETA(mu_P, mu_PZ), 1.5, 5.5)
            - GUARD(nTracks, 0, 600)
    wpid_mu_ubdt_veto:
        particle: Mu_ubdt_veto
        vars:
            - GUARD(mu_P, 100.0, 200000.0)
            - GUARD(ETA(mu_P, mu_PZ), 1.5, 5.5)
            - GUARD(nTracks, 0, 600)
    wpid_k:
        particle: K
        vars:
            - GUARD(k_P, 100.0, 200000.0)
            - GUARD(ETA(k_P, k_PZ), 1.5, 5.5)
            - GUARD(nTracks, 0, 600)
    wpid_pi:
        particle: Pi
        vars:
            - GUARD(pi_P, 100.0, 200000.0)
            - GUARD(ETA(pi_P, pi_PZ), 1.5, 5.5)
            - GUARD(nTracks, 0, 600)

    ### Proton PID for isolated tracks
